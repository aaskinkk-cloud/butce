<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f0e8">
<title>Bütçe &amp; Hedef</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f0e8;--kart:#fffdf8;--yazi:#1f2a24;--soluk:#68716b;--kenar:#e1dbcf;--ana:#2f5d50;--ana2:#e1ece7;--kirmizi:#b4442f;--yesil:#2c7a4b;--yesilz:#dff2e4;--golge:0 1px 2px rgba(40,35,20,.06),0 4px 14px rgba(40,35,20,.05);--serif:Georgia,'Noto Serif',serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--kart:#1d2220;--yazi:#e9ece8;--soluk:#9aa39d;--kenar:#323a36;--ana:#7fc0a8;--ana2:#23312c;--kirmizi:#ef8a74;--yesil:#7fd09b;--yesilz:#1f3527;--golge:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141816;--kart:#1d2220;--yazi:#e9ece8;--soluk:#9aa39d;--kenar:#323a36;--ana:#7fc0a8;--ana2:#23312c;--kirmizi:#ef8a74;--yesil:#7fd09b;--yesilz:#1f3527;--golge:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--yazi);font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px}
.brand{flex:1;min-width:0}.brand b{display:block;font:700 21px/1.15 var(--serif);letter-spacing:-.01em}
.brand small{display:block;color:var(--soluk);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--kenar);background:var(--kart);font-size:20px;display:grid;place-items:center}
main{padding:0 12px 20px;max-width:880px;margin:0 auto}
.kart{background:var(--kart);border:1px solid var(--kenar);border-radius:16px;padding:12px;margin:10px 0;box-shadow:var(--golge)}
.satir{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--kenar);background:var(--kart);border-radius:12px;padding:9px 13px;font-weight:600;font-size:14.5px;min-height:42px}
.btn.ana{background:var(--ana);border-color:var(--ana);color:#fff}
:root[data-theme="dark"] .btn.ana{color:#0f1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ana{color:#0f1a16}}
.btn.kucuk{min-height:36px;padding:6px 10px;font-size:13.5px}
.btn.tehlike{color:var(--kirmizi)}
.inp{border:1px solid var(--kenar);background:var(--kart);border-radius:10px;padding:8px 10px;min-height:42px;width:100%;min-width:0}
.inp:focus{outline:2px solid var(--ana);outline-offset:-1px}
select.inp{padding-right:4px}
.etiket{font-size:12px;color:var(--soluk);font-weight:600;display:block;margin-bottom:3px}
/* sekmeler */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:var(--kart);border-top:1px solid var(--kenar);padding:4px 2px calc(env(safe-area-inset-bottom,0px) + 4px)}
.tabs button{border:0;background:none;border-radius:12px;padding:5px 0 4px;display:grid;justify-items:center;gap:1px;font-size:11.5px;font-weight:600;color:var(--soluk);min-height:54px}
.tabs button span{font-size:21px;line-height:1.1}
.tabs button.on{background:var(--ana2);color:var(--ana)}
/* özet */
.ozet{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ozet div{background:var(--kart);border:1px solid var(--kenar);border-radius:12px;padding:7px 8px;min-width:0}
.ozet span{display:block;font-size:11px;color:var(--soluk);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ozet b{display:block;font-size:16.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ozet .eksi b{color:var(--kirmizi)}.ozet .arti b{color:var(--yesil)}
.ozet small{display:block;font-size:10.5px;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yapiskan{position:sticky;top:0;z-index:20;background:var(--bg);padding:6px 0 6px;margin:0 -2px}
.ozet.uc{grid-template-columns:repeat(3,1fr)}
@media (max-width:380px){.ozet b{font-size:15px}}
/* bölümler */
.bol{border-radius:16px;margin:10px 0;overflow:hidden;border:1px solid var(--kenar);background:var(--kart);box-shadow:var(--golge);--sb:#eceae4;--sf:#55594f}
.bol-bas{display:flex;align-items:center;gap:8px;padding:11px 12px;background:var(--sb);color:var(--sf);cursor:pointer;user-select:none}
.bol-bas .ok{transition:transform .15s;font-size:13px}
.bol:not(.kapali) .bol-bas .ok{transform:rotate(90deg)}
.bol-ad{font-size:15.5px;letter-spacing:.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rozet{font-size:10.5px;font-weight:700;border:1px solid currentColor;border-radius:999px;padding:1px 7px;opacity:.75;white-space:nowrap}
.bol-top{text-align:right;line-height:1.1}.bol-top b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.bol-top i{font-style:normal;font-size:11px;opacity:.8}
.bol.kapali .bol-ic{display:none}
.bol-arac{display:flex;gap:6px;padding:8px 10px 2px;flex-wrap:wrap}
.bol-arac button{border:1px solid var(--kenar);background:var(--kart);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;min-height:34px}
.c-zikir{--sb:#f6edd6;--sf:#7c5d16}.c-banka{--sb:#e1eaf6;--sf:#2b5685}.c-fatura{--sb:#f8efcf;--sf:#7f600c}.c-odeme{--sb:#f7e2e5;--sf:#8d3c48}
.c-alis{--sb:#ebe4f5;--sf:#5a4789}.c-hedef{--sb:#e0f0e4;--sf:#2c6542}.c-yap{--sb:#ddf0ee;--sf:#21655e}.c-gelir{--sb:#e2f1e5;--sf:#2c6a43}.c-kredi{--sb:#f8e5d8;--sf:#87461f}.c-findik{--sb:#efe3d3;--sf:#76502a}.c-dugun{--sb:#f6e4ee;--sf:#86416a}
:root[data-theme="dark"] .bol-bas,:root[data-theme="dark"] .band-bas{background:color-mix(in srgb,var(--sb) 16%,#1d2220);color:color-mix(in srgb,var(--sf) 45%,#fff)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bol-bas,:root:not([data-theme="light"]) .band-bas{background:color-mix(in srgb,var(--sb) 16%,#1d2220);color:color-mix(in srgb,var(--sf) 45%,#fff)}}
.kalem{display:grid;grid-template-columns:40px 1fr 104px 34px;gap:6px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--kenar)}
.kalem:last-of-type{border-bottom:0}
.kalem .ad,.kalem .tutar{border:1px solid transparent;background:transparent;border-radius:9px;padding:7px 6px;min-width:0;width:100%;font-size:16px}
.kalem .ad:focus,.kalem .tutar:focus{border-color:var(--kenar);background:var(--bg);outline:none}
.kalem .tutar{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.kalem.odendi .ad,.kalem.odendi .tutar{opacity:.48}
.kalem.yesil{background:var(--yesilz)}
.x{width:34px;height:34px;border:0;background:none;color:var(--soluk);font-size:22px;border-radius:9px;line-height:1}
.x:active{background:var(--ana2)}
.cb{display:grid;place-items:center;width:40px;height:40px;position:relative}
.cb input{position:absolute;opacity:0;width:40px;height:40px;margin:0;cursor:pointer}
.cb i{width:28px;height:28px;border-radius:8px;border:2px solid var(--kenar);background:var(--kart);display:grid;place-items:center;pointer-events:none}
.cb input:checked+i{background:var(--yesil);border-color:var(--yesil)}
.cb input:checked+i::after{content:'';width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cb input:focus-visible+i{outline:2px solid var(--ana)}
.ekle{display:block;width:100%;border:0;border-top:1px dashed var(--kenar);background:none;padding:11px;color:var(--ana);font-weight:700;font-size:14.5px}
.bos{padding:14px;color:var(--soluk);text-align:center;font-size:14px}
/* kart satırları (fındık, hedef, düğün) */
.sat{padding:8px 10px;border-bottom:1px solid var(--kenar)}
.sat:last-of-type{border-bottom:0}
.sat1{display:grid;grid-template-columns:40px 1fr 34px;gap:6px;align-items:center}
.sat2{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px;margin:4px 0 0 46px}
.sat2.dort{grid-template-columns:1fr 1fr 1fr}
.mini{font-size:10.5px;color:var(--soluk);font-weight:600;display:block;margin:0 0 1px 3px}
.sat .inp{min-height:38px;padding:6px 8px}
.sag{text-align:right;font-variant-numeric:tabular-nums}
.hesapli{background:var(--yesilz)!important;font-weight:700}
.sat.odendi .sat1 .inp{opacity:.5}
.ciplar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.ciplar::-webkit-scrollbar{display:none}
.cip{border:1px solid var(--kenar);background:var(--kart);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;white-space:nowrap;min-height:36px;color:var(--soluk)}
.cip.on{background:var(--ana);border-color:var(--ana);color:#fff}
:root[data-theme="dark"] .cip.on{color:#0f1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cip.on{color:#0f1a16}}
.cip small{opacity:.7;margin-left:4px}
/* zikir / alıntı */
.band{border-radius:16px;overflow:hidden;border:1px solid var(--kenar);background:var(--kart);margin:10px 0;box-shadow:var(--golge)}
.band-bas{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 12px;background:var(--sb);color:var(--sf);cursor:pointer}
.band-bas b{font-size:14px;letter-spacing:.04em;white-space:nowrap}
.band-bas .oz{flex:1;min-width:0;font-size:13.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zar{border:0;background:rgba(255,255,255,.65);border-radius:12px;min-width:44px;height:40px;font-size:20px}
.band:not(.acik) .band-ic{display:none}
.band-ic{padding:14px}
.okuma{font:17.5px/1.7 var(--serif);white-space:pre-wrap;margin:0}
.okuma-bas{font:700 18px/1.3 var(--serif);margin:0 0 8px}
.kat{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--ana2);color:var(--ana);margin-bottom:8px}
.sayac{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.sayac .say{flex:1;min-width:150px;height:64px;border-radius:16px;border:2px solid var(--kenar);background:var(--bg);font:800 26px system-ui;font-variant-numeric:tabular-nums}
.sayac .say small{font-size:14px;font-weight:600;color:var(--soluk)}
.sayac .say.tamam{border-color:var(--yesil);background:var(--yesilz);color:var(--yesil)}
.sayac .eksi{width:52px;height:52px;border-radius:14px;border:1px solid var(--kenar);background:var(--kart);font-size:24px}
.zk{border-radius:14px;border:1px solid var(--kenar);background:var(--kart);margin:10px 0;padding:12px 12px 10px;box-shadow:var(--golge);border-left:5px solid var(--kc,#c9b37a)}
.zk-ust{display:flex;gap:8px;align-items:flex-start}
.zk-ust h3{flex:1;margin:0;font:700 16.5px/1.3 var(--serif)}
.yildiz{border:0;background:none;font-size:22px;line-height:1;color:var(--kenar);padding:0 2px;min-width:32px;min-height:32px}
.yildiz.on{color:#d9a21b}
.zk .okuma{font-size:16px;line-height:1.62;margin-top:6px}
.zk-alt{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.zk-alt .btn{min-height:34px;padding:5px 10px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--kenar);border-radius:999px;padding:2px 4px}
.pill button{border:0;background:none;width:34px;height:32px;font-size:18px;color:var(--ana)}
.pill b{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.pill.tamam{background:var(--yesilz);border-color:var(--yesil)}
.kaynak{font-size:13.5px;color:var(--soluk);margin-top:6px;font-style:italic}
.duzen textarea{min-height:120px;resize:vertical;line-height:1.5}
.duzen .inp{margin-bottom:8px}
/* sheet, toast, hesap makinesi */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;background:var(--kart);border-radius:20px;padding:14px;max-height:min(82vh,720px);overflow:auto;width:min(560px,calc(100% - 24px));box-shadow:0 18px 50px -12px rgba(0,0,0,.45);animation:shGel .16s ease-out}
@keyframes shGel{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%)}}
.sheet h3{margin:2px 4px 10px;font:700 17px var(--serif)}
.sheet .liste button{display:flex;width:100%;align-items:center;gap:12px;border:0;background:none;padding:13px 8px;border-radius:12px;font-size:15.5px;text-align:left}
.sheet .liste button:active{background:var(--ana2)}
.sheet .not{font-size:12.5px;color:var(--soluk);padding:6px 8px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#1d2621;color:#fff;border-radius:14px;padding:10px 14px;font-size:14.5px;z-index:60;transition:.2s;display:flex;gap:12px;align-items:center;max-width:calc(100% - 28px)}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:#fff;color:#1d2621;border-radius:10px;padding:6px 12px;font-weight:700}
.hm{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:35;width:min(300px,calc(100% - 20px));background:var(--kart);border:1px solid var(--kenar);border-radius:18px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.hm-ekran{width:100%;border:1px solid var(--kenar);border-radius:12px;background:var(--bg);padding:8px 10px;font:700 24px system-ui;text-align:right;font-variant-numeric:tabular-nums}
.hm-gecmis{font-size:12px;color:var(--soluk);text-align:right;min-height:16px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-tus{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.hm-tus button{height:46px;border-radius:12px;border:1px solid var(--kenar);background:var(--bg);font-size:19px;font-weight:600}
.hm-tus .op{color:var(--ana)}.hm-tus .esit{background:var(--ana);color:#fff;border-color:var(--ana)}
.hm-alt{display:flex;gap:6px;margin-top:6px}.hm-alt .btn{flex:1;min-height:38px;font-size:13px;padding:4px}
.surum{text-align:center;color:var(--soluk);font-size:12px;margin:18px 0 6px}
.ipucu{font-size:12.5px;color:var(--soluk);margin:4px 2px}
details.kart>summary{font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.kart>summary::before{content:'▸';font-size:12px;transition:transform .15s}
details.kart[open]>summary::before{transform:rotate(90deg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sonuc{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.sonuc div{background:var(--bg);border-radius:10px;padding:7px 9px}.sonuc span{font-size:11.5px;color:var(--soluk);display:block}.sonuc b{font-variant-numeric:tabular-nums}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5}
.alt-top{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--bg);font-size:13.5px;font-weight:600;flex-wrap:wrap}
.alt-top b{font-variant-numeric:tabular-nums}
.d-sonuc{display:flex;gap:10px;flex-wrap:wrap;margin:5px 0 0 46px;font-size:12.5px;color:var(--soluk)}
.d-sonuc b{color:var(--yazi);font-variant-numeric:tabular-nums}
.sat.alinan{background:color-mix(in srgb,var(--yesilz) 55%,transparent)}
#cikti{display:none}
@media print{
  body{background:#fff;color:#000;padding:0;font-size:10.5pt}
  body>*:not(#cikti){display:none!important}
  #cikti{display:block!important}
  #cikti h1{font:700 15pt Georgia,serif;margin:0 0 4pt}#cikti h2{font:700 12pt Georgia,serif;margin:12pt 0 4pt}
  #cikti table{width:100%;border-collapse:collapse;margin-bottom:6pt}
  #cikti td,#cikti th{border:.5pt solid #777;padding:3pt 5pt;text-align:left;vertical-align:top}
  #cikti td.s{text-align:right;white-space:nowrap}
  #cikti tr.o td{color:#666}
  #cikti .zp{break-inside:avoid;margin-bottom:9pt}#cikti .zp p{margin:2pt 0;white-space:pre-wrap;line-height:1.45}
  @page{size:A4;margin:14mm}
}

a{color:var(--ana)}
:root[data-theme="dark"] .zar{background:rgba(255,255,255,.1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .zar{background:rgba(255,255,255,.1)}}

/* ---- 1.1: sade onay kutuları, geniş kalem yazıları, tablo düzeni ---- */
.btn{min-height:38px;padding:7px 12px;font-size:14px;border-radius:11px}
.ib{width:40px;height:40px;font-size:18px;border-radius:12px}
.ck{width:20px;height:20px;margin:0;accent-color:var(--ana);cursor:pointer;flex:0 0 auto}
.kalem{grid-template-columns:22px 1fr 88px 24px;gap:6px;padding:3px 8px 3px 12px}
.hc{border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 4px;min-width:0;width:100%;font-size:15.5px;color:inherit}
.hc:focus{border-color:var(--kenar);background:var(--bg);outline:none}
.kalem .tutar,.hc.tutar{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.kalem.odendi .hc{opacity:.5}
.x{width:24px;height:30px;font-size:19px;padding:0}
.bol-bas{padding:9px 12px}
.bol-arac{gap:5px;padding:6px 10px 4px;align-items:center}
.bol-arac button{min-height:28px;padding:3px 9px;font-size:12.5px}
.bol-arac button.on{background:var(--ana);color:#fff;border-color:var(--ana)}
.th{display:grid;gap:6px;padding:5px 8px 3px 12px;font-size:11px;font-weight:700;color:var(--soluk);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--kenar)}
.th span:nth-child(n+3){text-align:right}
.fgrid{grid-template-columns:22px 1fr 42px 58px 76px 24px}
.hgrid{grid-template-columns:22px 1fr 20px 80px 24px}
.hgrid.th span:nth-child(3){text-align:center}
.lnk{text-decoration:none;font-weight:700;text-align:center;color:var(--ana)}
.kaydir{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tb{width:100%;min-width:560px;border-collapse:collapse;font-size:14.5px}
.tb th{font-size:11px;font-weight:700;color:var(--soluk);text-transform:uppercase;text-align:left;padding:6px 6px 4px;border-bottom:1px solid var(--kenar);white-space:nowrap}
.tb td{padding:2px 4px;border-bottom:1px solid var(--kenar);vertical-align:middle}
.tb td.hs{text-align:right;font-variant-numeric:tabular-nums;padding-right:8px;white-space:nowrap}
.tb tr.alinan{background:var(--yesilz)}
.tb select.hc{padding:6px 2px}
.tb input[type=date].hc{min-width:122px}
.zar{font-size:13px;font-weight:700;padding:0 10px;min-width:0;height:34px;border-radius:10px;color:inherit;white-space:nowrap}
.sayac .say{height:58px}
@media (max-width:360px){.fgrid{grid-template-columns:20px 1fr 36px 52px 70px 22px}.kalem{padding-left:8px}}
.f2grid{grid-template-columns:22px 1fr 88px 24px}
.f2grid.th span:nth-child(3){text-align:right}
.toast button{white-space:nowrap}
.tb td:nth-child(2) .hc{min-width:180px}

/* ---- 1.2: hafif oval onay kutusu sağda, çizgi ikonlar, bir tık büyük yazı ---- */
body{font-size:17px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:-4px}
.ib .ic{width:22px;height:22px}
.tabs button{font-size:12.5px;gap:3px;padding-top:7px}

/* ---- 1.4: düzenli dönem kartı, renkli özet, sayaç tek satır ---- */

<script>
(function(){
'use strict';
const SURUM='1.9';
const KEY='butceHedef.v1',UKEY='butceHedef.ui';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let _n=0;const yid=p=>(p||'X')+Date.now().toString(36)+(_n++).toString(36)+Math.random().toString(36).slice(2,6);
/* Türkçe sayı okuma: "1.500,50" → 1500.5 · "1.500" → 1500 · "12,5" → 12.5 */
function sayi(v){
  if(v===''||v==null)return '';
  if(typeof v==='number')return isFinite(v)?v:'';
  let s=String(v).trim().replace(/\s|TL|₺|\$|€/gi,'');if(!s)return '';
  const neg=/^-/.test(s);s=s.replace(/^[-+]/,'');
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);return isFinite(n)?(neg?-n:n):'';
}
const N=v=>{const n=sayi(v);return n===''?0:n};
const tl=(n,bos)=>{n=sayi(n);if(n==='')return bos==null?'':bos;return Number(n).toLocaleString('tr-TR',{maximumFractionDigits:2})};
const T0=n=>tl(n,'0');
const Ti=n=>{n=sayi(n);return n===''?'0':Math.round(n).toLocaleString('tr-TR')};
const bugunISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const trTarih=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?m[3]+'.'+m[2]+'.'+m[1]:(iso||'')};
const rast=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- Veri ---------- */
let D,U;
function yukle(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){d=null}
  if(!d||typeof d!=='object'){d=seed();d.meta={olusturma:Date.now(),yedek:0,tohum:true};D=d;kaydet.tohum=1;kaydet(true);kaydet.tohum=0}
  return onar(d);
}
function onar(d){
  if(!Array.isArray(d.aylar)||!d.aylar.length){const s=seed();d.aylar=s.aylar;d.aktifAy=s.aktifAy}
  d.aylar.forEach(a=>{if(!Array.isArray(a.bolumler))a.bolumler=[];a.bolumler.forEach(b=>{if(!Array.isArray(b.kalemler))b.kalemler=[]})});
  if(!d.aylar.some(a=>a.id===d.aktifAy))d.aktifAy=d.aylar[d.aylar.length-1].id;
  if(!d.hesap)d.hesap={maas:'',artis:'',acik:false};
  if(!d.findik||!Array.isArray(d.findik.sezonlar)||!d.findik.sezonlar.length){const s=seed();d.findik=s.findik}
  d.findik.sezonlar.forEach(s=>{s.kalemler=s.kalemler||[];s.gelir=s.gelir||[];s.notlar=s.notlar||''});
  if(!d.findik.sezonlar.some(s=>s.id===d.findik.aktif))d.findik.aktif=d.findik.sezonlar[d.findik.sezonlar.length-1].id;
  if(!Array.isArray(d.hedefler))d.hedefler=[];
  if(!d.dugun)d.dugun={guncelUsd:'',kayitlar:[]};if(!Array.isArray(d.dugun.kayitlar))d.dugun.kayitlar=[];
  if(!Array.isArray(d.zikirler))d.zikirler=[];
  if(!Array.isArray(d.alintilar))d.alintilar=[];
  if(!Array.isArray(d.okurAtla))d.okurAtla=[];
  try{d.alintilar.forEach(alintiOnar)}catch(e){}
  if(!d.meta)d.meta={olusturma:Date.now(),yedek:0};
  return d;
}
let kT=null;
function kaydet(hemen){
  clearTimeout(kT);
  const f=()=>{const ic=icImza();if(ic===kaydet._son&&!kaydet.tohum)return;kaydet._son=ic;if(!kaydet.tohum&&D.meta)D.meta.tohum=false;try{D.meta.son=Date.now();localStorage.setItem(KEY,JSON.stringify(D))}catch(e){if(!kaydet.uyardi&&!Kopru.bagli){kaydet.uyardi=1;toast('Kaydedilemedi: bu ortamda kalıcı depolama yok ya da dolu. Menü → Yedek indir')}}try{if(!kaydet.tohum)Kopru.gonder(hemen)}catch(e){}};
  if(hemen)f();else kT=setTimeout(f,150);
}
function uiKaydet(){try{localStorage.setItem(UKEY,JSON.stringify({tab:U.tab,tema:U.tema,tamEkran:U.tamEkran!==false,anaAdres:U.anaAdres||'',bRenk:U.bRenk||'klasik',aGrup:U.aGrup||'kat',dGor:U.dGor||'bolum',dGrup:U.dGrup||'yil'}))}catch(e){}}
/* Geri alma: silmeden önce anlık kopya */
let geriKopya=null;
function anlik(){geriKopya=JSON.stringify(D)}
function geriAlToast(msg){toast(msg,'Geri al',()=>{if(!geriKopya)return;D=onar(JSON.parse(geriKopya));geriKopya=null;kaydet(true);ciz();toast('Geri alındı')})}

/* ---------- Genel arayüz ---------- */
let tT=null;
function toast(msg,btn,fn){
  const t=$('#toast');t.innerHTML='<span>'+esc(msg)+'</span>'+(btn?'<button type="button">'+esc(btn)+'</button>':'');
  if(btn)t.querySelector('button').onclick=()=>{t.classList.remove('on');fn()};
  t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),btn?6000:2600);
}
function sheet(html){$('#sheet').innerHTML=html;$('#sheet').hidden=false;$('#scrim').hidden=false}
function kapat(){$('#sheet').hidden=true;$('#scrim').hidden=true}
const SEKMELER=[['butce','Bütçe','butce'],['findik','Fındık','findik'],['hedef','Hedefler','hedef'],['dugun','Düğünler','dugun'],['zikir','Zikir','zikir'],['alinti','Alıntılar','alinti']];
function tabsCiz(){$('#tabs').innerHTML=SEKMELER.map(s=>'<button class="'+(U.tab===s[0]?'on':'')+'" onclick="A.sekme(\''+s[0]+'\')"><svg class="ic tab-ic"><use href="#i-'+s[2]+'"/></svg>'+s[1]+'</button>').join('')}
function sekme(t){
  if(t===U.tab){window.scrollTo({top:0,behavior:'smooth'});return}
  U.tab=t;uiKaydet();if(t==='butce'){zSec();aSec()}if(t==='alinti')setTimeout(()=>okurAl(),0);
  ciz();window.scrollTo(0,0);
}
function ciz(){
  tabsCiz();
  const f={butce:butceHtml,findik:findikHtml,hedef:hedefHtml,dugun:dugunHtml,zikir:zikirHtml,alinti:alintiHtml}[U.tab]||butceHtml;
  $('#v').innerHTML=f()+'<div class="surum">Bütçe &amp; Hedef · sürüm '+SURUM+'</div>';
}

/* ==================== AYLIK BÜTÇE ==================== */
const AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const ay=()=>D.aylar.find(a=>a.id===D.aktifAy)||D.aylar[D.aylar.length-1];
const bol=id=>ay().bolumler.find(b=>b.id===id);
const PLAN_RE=/ALIŞVERİŞ|ALISVERIS|HEDEF|YAPILACAK|KREDİ KART|KREDI KART|ZİKİR|NOTLAR/i;
const planMi=b=>b.plan==null?PLAN_RE.test(b.ad):!!b.plan;
function renk(ad){
  const a=String(ad||'').toLocaleUpperCase('tr');
  if(/ZİKİR|DUA/.test(a))return 'c-zikir';if(/KREDİ KART/.test(a))return 'c-kredi';if(/BANKA|KREDİ|BORÇ/.test(a))return 'c-banka';
  if(/FATURA|AİDAT/.test(a))return 'c-fatura';if(/ÖDEME|HARÇLIK/.test(a))return 'c-odeme';if(/ALIŞVERİŞ|MARKET/.test(a))return 'c-alis';
  if(/HEDEF/.test(a))return 'c-hedef';if(/YAPILACAK/.test(a))return 'c-yap';if(/MAAŞ|GELİR/.test(a))return 'c-gelir';
  if(/FINDIK/.test(a))return 'c-findik';if(/DÜĞÜN/.test(a))return 'c-dugun';return '';
}
function ayHesap(a){
  let top=0,od=0;
  a.bolumler.forEach(b=>{if(planMi(b))return;b.kalemler.forEach(k=>{const t=N(k.tutar);top+=t;if(k.odendi)od+=t})});
  const m=N(a.maas);return {m,top,od,kalan:m-od,hepsi:m-top,yuzde:m?Math.round(od/m*100):0};
}
function ozetHtml(){
  const h=ayHesap(ay());
  const y=Math.max(0,Math.min(100,h.yuzde));
  return '<div class="ozetk" id="ozet"><div class="ozet uc">'+
    '<div class="o-top"><span>Toplam kalem</span><b>'+Ti(h.top)+'</b></div>'+
    '<div class="o-od"><span>Ödenen</span><b>'+Ti(h.od)+'</b></div>'+
    '<div class="'+(h.kalan<0?'eksi':'arti')+'"><span>Kalan</span><b>'+Ti(h.kalan)+'</b></div></div>'+
    '<div class="ilerle'+(h.yuzde>100?' asti':'')+'"><i style="width:'+y+'%"></i></div>'+
    '<div class="ozet-alt"><span>Maaşın <b>%'+h.yuzde+'</b>\'i ödendi</span><span>Hepsi ödenince <b class="'+(h.hepsi<0?'kirmizi':'')+'">'+Ti(h.hepsi)+'</b></span></div></div>';
}
function toplamTazele(){
  const o=$('#ozet');if(o)o.outerHTML=ozetHtml();
  ay().bolumler.forEach(b=>{let it=0,io=0;b.kalemler.forEach(k=>{const t=N(k.tutar);it+=t;if(k.odendi)io+=t});
    const x=document.getElementById('bo-'+b.id),y=document.getElementById('bt-'+b.id);if(x)x.textContent=T0(io);if(y)y.textContent=T0(it)});
}
/* Rastgele zikir & alıntı (bütçe her açıldığında yenilenir) */
function havuz(l){const f=l.filter(x=>x.fav);return f.length?f:l}
function zSec(){const l=havuz(D.zikirler);U.rz=l.length?rast(l).id:null}
function aSec(){const l=havuz(D.alintilar);U.ra=l.length?rast(l).id:null}
function bugunSayac(z){return z.tarih===bugunISO()?(Number(z.sayac)||0):0}
function sayacHtml(z,buyuk){
  const s=bugunSayac(z),h=Number(z.sayi)||0,ok=h&&s>=h;
  if(buyuk)return '<div class="sayac"><button class="eksi" onclick="A.zSay(\''+z.id+'\',-1)" aria-label="Bir azalt">−</button>'+
    '<button class="say'+(ok?' tamam':'')+'" id="zs-'+z.id+'" onclick="A.zSay(\''+z.id+'\',1)">'+s+(h?' <small>/ '+h+'</small>':'')+(ok?' ✓':'')+'</button>'+
    '<button class="eksi" onclick="A.zSifir(\''+z.id+'\')" aria-label="Sayacı sıfırla"><svg class="ic"><use href="#i-sifirla"/></svg></button></div>';
  return '<span class="pill'+(ok?' tamam':'')+'" id="zp-'+z.id+'"><button onclick="A.zSay(\''+z.id+'\',-1)" aria-label="Azalt">−</button><b>'+s+(h?'/'+h:'')+'</b><button onclick="A.zSay(\''+z.id+'\',1)" aria-label="Artır">+</button></span>';
}
function rSilHtml(t,id){return '<div class="rsil"><button onclick="event.stopPropagation();A.rSil(\''+t+'\',\''+id+'\')" aria-label="Bunu sil"><svg class="ic"><use href="#i-sil"/></svg>Sil</button></div>'}
function zBandHtml(){
  const z=D.zikirler.find(x=>x.id===U.rz);
  return '<div class="band c-zikir'+(U.zAcik?' acik':'')+'"><div class="band-bas" onclick="A.zBand()"><b><svg class="ic"><use href="#i-zikir"/></svg>ZİKİR ÇEK</b><span class="oz">'+esc(z?z.ad:'Zikir yok')+'</span>'+
    '<button class="zar" onclick="event.stopPropagation();A.zZar()" aria-label="Rastgele zikir çek" title="Rastgele zikir çek"><svg class="ic"><use href="#i-zikircek"/></svg></button></div>'+
    '<div class="band-ic">'+(z?'<span class="kat">'+esc(z.kat)+'</span><h3 class="okuma-bas">'+esc(z.ad)+'</h3><p class="okuma">'+esc(z.metin)+'</p>'+sayacHtml(z,true)+rSilHtml('z',z.id):'<div class="bos">Zikir sekmesinden kayıt ekle</div>')+'</div></div>';
}
function aBandHtml(){
  const q=D.alintilar.find(x=>x.id===U.ra);if(!q)return '';
  return '<div class="band c-alis'+(U.aAcik?' acik':'')+'"><div class="band-bas" onclick="A.aBand()"><b><svg class="ic"><use href="#i-alinti"/></svg>ALINTI</b><span class="oz">'+esc(q.metin.split('\n')[0])+'</span>'+
    '<button class="zar" onclick="event.stopPropagation();A.aZar()" aria-label="Rastgele alıntı" title="Rastgele alıntı"><svg class="ic"><use href="#i-yenile"/></svg></button></div>'+
    '<div class="band-ic"><p class="okuma">'+esc(q.metin)+'</p>'+(q.kaynak?'<div class="kaynak">— '+esc(q.kaynak)+'</div>':'')+rSilHtml('a',q.id)+'</div></div>';
}
function butceHtml(){
  const a=ay();
  let h='<div class="donem c-gelir"><div class="donem-ust"><select class="donem-sec" onchange="A.aySec(this.value)" aria-label="Dönem">'+
    D.aylar.map(x=>'<option value="'+x.id+'"'+(x.id===a.id?' selected':'')+'>'+esc(x.ad)+'</option>').join('')+'</select>'+
    '<button class="btn ana" onclick="A.yeniAy()" title="Yeni dönem (önceki ay kopyalanır)"><svg class="ic"><use href="#i-arti"/></svg>Yeni</button><button class="btn ikon" onclick="A.ayMenu()" aria-label="Dönem işlemleri">⋯</button></div>'+
    '<label class="donem-maas"><span>Gelir / Maaş</span><input inputmode="decimal" value="'+esc(tl(a.maas))+'" onchange="A.maas(this.value,this)" aria-label="Gelir / Maaş"><em>TL</em></label></div>';
  h+='<div class="yapiskan">'+ozetHtml()+'</div>';
  h+=zBandHtml()+aBandHtml();
  a.bolumler.forEach(b=>{h+=bolumHtml(b)});
  h+='<button class="btn" style="width:100%;margin-top:4px" onclick="A.bolEkle()">+ Yeni bölüm</button>';
  h+=maasHesapHtml();
  return h;
}
function bolumHtml(b){
  const bix=Math.max(0,ay().bolumler.indexOf(b));
  const plan=planMi(b),suz=U.suz[b.id]||'hepsi';let it=0,io=0;
  b.kalemler.forEach(k=>{const t=N(k.tutar);it+=t;if(k.odendi)io+=t});
  const kal=b.kalemler.filter(k=>suz==='hepsi'||(suz==='isaretli'?k.odendi:!k.odendi));
  return '<section class="bol '+(U.bRenk==='pastel'?'c-p'+(bix%12):renk(b.ad))+(b.kapali?' kapali':'')+'"><div class="bol-bas" onclick="A.bolAc(\''+b.id+'\')"><span class="ok">▸</span><b class="bol-ad">'+esc(b.ad)+'</b>'+
    (plan?'<span class="rozet">plan</span>':'')+'<span class="bol-top"><b id="bo-'+b.id+'">'+T0(io)+'</b><i>/ <span id="bt-'+b.id+'">'+T0(it)+'</span></i></span></div>'+
    '<div class="bol-ic"><div class="bol-arac"><button onclick="A.suz(\''+b.id+'\')" title="Süz">'+{hepsi:'Tümü',isaretli:'✓ İşaretli',isaretsiz:'○ İşaretsiz'}[suz]+'</button>'+
    '<button onclick="A.hepsiIsaret(\''+b.id+'\')" title="Hepsini işaretle">✓ Hepsi</button><button onclick="A.isaretKaldir(\''+b.id+'\')" title="İşaretleri kaldır">☐ Kaldır</button>'+
    '<button onclick="A.bolMenu(\''+b.id+'\')" aria-label="Bölüm işlemleri">⋯</button>'+(plan?'<span class="ipucu" style="margin:0 0 0 auto">toplama girmez</span>':'')+'</div>'+
    (kal.map(k=>kalemHtml(b,k)).join('')||'<div class="bos">'+(b.kalemler.length?'Süzgece uyan kalem yok':'Kalem yok')+'</div>')+
    '<button class="ekle" onclick="A.kalemEkle(\''+b.id+'\')">+ Kalem ekle</button></div></section>';
}
function kalemHtml(b,k){
  return '<div class="kalem'+(k.odendi?' odendi':'')+(k.yesil?' yesil':'')+'" id="k-'+k.id+'">'+
    '<input class="hc ad" value="'+esc(k.ad)+'" placeholder="Kalem adı" onchange="A.kalemYaz(\''+b.id+'\',\''+k.id+'\',\'ad\',this.value)">'+
    '<input class="hc tutar" inputmode="decimal" value="'+esc(tl(k.tutar))+'" placeholder="0" onchange="A.kalemYaz(\''+b.id+'\',\''+k.id+'\',\'tutar\',this.value,this)">'+
    '<input type="checkbox" class="ck" aria-label="Ödendi"'+(k.odendi?' checked':'')+' onchange="A.isaret(\''+b.id+'\',\''+k.id+'\',this.checked)">'+
    '<button class="x" onclick="A.kalemSil(\''+b.id+'\',\''+k.id+'\')" aria-label="Kalemi sil">×</button></div>';
}
function maasHesap(){const m=N(D.hesap.maas),a=N(D.hesap.artis),net=m*(1+a/100),fark=net-m;return {net,fark,yari:fark/2,ele:net+fark/2}}
function maasHesapHtml(){
  const r=maasHesap();
  return '<details class="kart c-gelir"'+(D.hesap.acik?' open':'')+' ontoggle="A.hesapAc(this.open)"><summary><svg class="ic"><use href="#i-maas"/></svg>MAAŞ HESAPLA</summary>'+
    '<div class="grid2" style="margin-top:10px"><label><span class="etiket">Maaş</span><input class="inp sag" inputmode="decimal" value="'+esc(tl(D.hesap.maas))+'" oninput="A.hesap(\'maas\',this.value)" onchange="this.value=A.tl(this.value)"></label>'+
    '<label><span class="etiket">Artış %</span><input class="inp sag" inputmode="decimal" value="'+esc(tl(D.hesap.artis))+'" oninput="A.hesap(\'artis\',this.value)"></label></div>'+
    '<div class="sonuc" id="hesapSonuc">'+hesapSonucHtml(r)+'</div><div class="ipucu">Ele geçen = Net + farkın yarısı</div></details>';
}
const hesapSonucHtml=r=>'<div><span>Net</span><b>'+T0(r.net)+'</b></div><div><span>Fark</span><b>'+T0(r.fark)+'</b></div><div><span>Farkın yarısı</span><b>'+T0(r.yari)+'</b></div><div><span>Ele geçen</span><b>'+T0(r.ele)+'</b></div>';
function sonrakiAd(ad){
  const s=String(ad||'').trim();
  for(let i=0;i<12;i++){if(s.toLocaleLowerCase('tr').indexOf(AYLAR[i].toLocaleLowerCase('tr'))===0){
    const y=(s.match(/(\d{4})/)||[])[1];const j=(i+1)%12;const yy=y?(+y+(i===11?1:0)):'';return AYLAR[j]+(yy?' '+yy:'')}}
  const d=new Date();return AYLAR[d.getMonth()]+' '+d.getFullYear();
}

/* ==================== FINDIK SARFI ==================== */
const sezon=()=>D.findik.sezonlar.find(s=>s.id===D.findik.aktif)||D.findik.sezonlar[0];
function fHesap(s){
  let top=0,isa=0,adet=0,kg=0,gel=0,tah=0;
  s.kalemler.forEach(k=>{const t=N(k.tutar);top+=t;if(k.odendi)isa+=t;adet+=N(k.adet)});
  s.gelir.forEach(g=>{const t=N(g.tutar);gel+=t;if(g.tahsil)tah+=t;kg+=N(g.kg)});
  return {top,isa,kalan:top-isa,adet,kg,gel,tah,bek:gel-tah,net:gel-top};
}
function fOzetHtml(){
  const r=fHesap(sezon());

const DUGUN_TUR=['Nakit TL','Nakit USD','Nakit EUR','Çeyrek Altın','Yarım Altın','Tam Altın','Gram Altın','Bilezik','Takı (diğer)','Masraf'];
/* Tutar her zaman TL; Nakit USD'de birim dolar yazılır, TL = adet×birim×kur */
function dHesap(d){
  const adet=d.adet===''?1:N(d.adet),birim=N(d.birim),kur=N(d.kur),g=N(D.dugun.guncelUsd);
  let tlv,usd;
  if(d.tur==='Nakit USD'){usd=adet*birim;tlv=kur?usd*kur:0}
  else{tlv=adet*birim;usd=kur?tlv/kur:0}
  const bugun=usd&&g?usd*g:tlv;
  return {tl:tlv,usd,bugun,fark:bugun-tlv};
}
function dToplam(){
  let ver=0,al=0,o=0,usd=0;D.dugun.kayitlar.forEach(d=>{const r=dHesap(d);o+=r.tl;usd+=r.usd;if(d.yon==='alinan')al+=r.bugun;else ver+=r.bugun});
  return {ver,al,o,usd,net:al-ver};
}
function dOzetHtml(){const r=dToplam();return '<div class="ozet" id="dOzet"><div><span>Verilen (bugün)</span><b>'+Ti(r.ver)+'</b></div><div class="arti"><span>Alınan (bugün)</span><b>'+Ti(r.al)+'</b></div><div><span>O günkü toplam</span><b>'+Ti(r.o)+'</b><small>'+tl(r.usd,'0')+' $</small></div><div class="'+(r.net<0?'eksi':'arti')+'"><span>Fark</span><b>'+Ti(r.net)+'</b><small>alınan − verilen</small></div></div>'}

function dGrupAd(d,g){if(g==='yil')return (String(d.tarih||'').slice(0,4)||'Tarihsiz');if(g==='yon')return d.yon==='alinan'?'Alınanlar':'Verilenler';if(g==='tur')return d.tur||'Diğer';
  const k=String(d.kisi||'').trim();if(!k)return 'İsimsiz';return k.split(/\s+[—–-]\s+|,/)[0].trim().replace(/\s+(düğünü|nişanı|kınası|sünneti)$/i,'').trim()||k}

  D.dugun.kayitlar.forEach(d=>{const k=dGrupAd(d,g);if(!m.has(k))m.set(k,[]);m.get(k).push(d)});
  let gr=[...m.entries()];gr.sort((a,b)=>g==='yil'?String(b[0]).localeCompare(String(a[0])):g==='kisi'?a[0].localeCompare(b[0],'tr'):b[1].length-a[1].length);

    l.sort((a,b)=>String(b.tarih).localeCompare(String(a.tarih)));
    h+='<section class="bol dbol '+DPAS[i%DPAS.length]+(kap?' kapali':'')+'"><div class="bol-bas" onclick="A.dKap(this.dataset.k)" data-k="'+esc(g+':'+ad)+'"><span class="ok">▸</span><b class="bol-ad">'+esc(ad)+'</b><span class="bol-top"><b>'+l.length+'</b><i>kayıt</i></span></div>'+

      l.map(d=>{const r=dHesap(d),fark=r.bugun-r.tl;return '<button class="dk'+(d.yon==='alinan'?' alinan':'')+'" onclick="A.dDuzen(\''+d.id+'\')"><span class="dk-sol"><b>'+esc(d.kisi||'İsimsiz')+'</b><small>'+(d.tarih?esc(trTarih(d.tarih))+' · ':'')+esc(d.tur)+(N(d.adet)&&N(d.adet)!==1?' × '+tl(d.adet):'')+'</small></span>'+
        '<span class="dk-sag"><b>'+T0(r.bugun)+'</b><small>'+(Math.abs(fark)>=1&&r.tl?(fark>0?'▲ ':'▼ ')+T0(Math.abs(fark)):(d.yon==='alinan'?'alınan':'verilen'))+'</small></span></button>'}).join('')+
      '<button class="ekle" onclick="A.dYeni(\''+esc(g)+'\',this.dataset.v)" data-v="'+esc(ad)+'">+ Bu bölüme kayıt</button></div></section>'});
  return h}

let sonAlan=null;
document.addEventListener('focusin',e=>{const t=e.target;if(t&&t.matches&&t.matches('input[inputmode="decimal"]'))sonAlan=t});
const HM={ifade:'',gecmis:''};
function hmHesapla(s){
  /* Türkçe sayıları JS sayısına çevir; yalnız rakam ve işleç kalırsa hesapla */
  const t=String(s).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/[\d.,]+/g,m=>{const n=sayi(m);return n===''?'NaN':String(n)});
  if(!/^[\d.+\-*/() eE]+$/.test(t)||/NaN/.test(t))return NaN;
  try{const r=Function('"use strict";return ('+t+')')();return typeof r==='number'&&isFinite(r)?Math.round(r*100)/100:NaN}catch(e){return NaN}
}
function hmCiz(){const e=$('#hmEkran');if(e)e.value=HM.ifade;const g=$('#hmGecmis');if(g)g.textContent=HM.gecmis}
function hmTus(k){
  if(k==='C'){HM.ifade='';HM.gecmis=''}
  else if(k==='⌫')HM.ifade=HM.ifade.slice(0,-1);
  else if(k==='='){const r=hmHesapla(HM.ifade);if(isNaN(r)){toast('İşlem anlaşılamadı');return}HM.gecmis=HM.ifade+' =';HM.ifade=tl(r);}
  else HM.ifade+=k;
  hmCiz();
}
function hmAc(){
  const p=$('#hm');if(!p.hidden){p.hidden=true;return}
  const tus=['7','8','9','÷','4','5','6','×','1','2','3','−','0',',','=','+','C','⌫','(',')'];
  p.innerHTML='<div class="hm-gecmis" id="hmGecmis"></div><input class="hm-ekran" id="hmEkran" inputmode="none" aria-label="İşlem" oninput="A.hmYaz(this.value)" onkeydown="if(event.key===\'Enter\')A.hmTus(\'=\')">'+
    '<div class="hm-tus">'+tus.map(k=>'<button type="button" class="'+(/[÷×−+()]/.test(k)?'op':k==='='?'esit':'')+'" onclick="A.hmTus(\''+k+'\')">'+k+'</button>').join('')+'</div>'+
    '<div class="hm-alt"><button class="btn" onclick="A.hmAlana()"><svg class="ic"><use href="#i-asagi"/></svg>Alana yaz</button><button class="btn" onclick="A.hmKopya()">Kopyala</button><button class="btn" onclick="A.hmAc()">Kapat</button></div>';
  p.hidden=false;hmCiz();
}

const yzKatla=s=>String(s||'').toLocaleLowerCase('tr').replace(/[âàá]/g,'a').replace(/[îíì]/g,'i').replace(/[ûúù]/g,'u').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ç/g,'c').replace(/ö/g,'o').replace(/ü/g,'u').replace(/é/g,'e');
/* metni karşılaştırma biçimine çevirir; her katlanmış harfin özgün metindeki yerini de tutar */
function yzHarita(t){let f='',m=[];for(let i=0;i<t.length;i++){let c=yzKatla(t[i]);if(!/^[a-z0-9]$/.test(c))c=' ';for(const ch of c){f+=ch;m.push(i)}}return {f,m}}
const YZ_IDX=(()=>{const l=[];YAZARLAR.forEach(([ad,...al])=>al.forEach(a=>l.push({ad,a:yzKatla(a).replace(/[^a-z0-9]+/g,' ').trim(),tip:'y'})));KITAPLAR.forEach(([k,y])=>l.push({ad:k,y,a:yzKatla(k).replace(/[^a-z0-9]+/g,' ').trim(),tip:'k'}));return l.sort((x,y)=>y.a.length-x.a.length)})();
function yzBul(t,tip){const H=yzHarita(t),F=' '+H.f+' ';const out=[];
  for(const e of YZ_IDX){if(tip&&e.tip!==tip)continue;if(e.a.length<3)continue;let i=F.indexOf(' '+e.a+' ');
    while(i>-1){const s=i,eN=i+e.a.length;if(!out.some(o=>s<o.e&&eN>o.s))out.push({e:eN,s,ad:e.ad,y:e.y,tip:e.tip,os:H.m[s],oe:H.m[eN-1]+1});i=F.indexOf(' '+e.a+' ',i+1)}}
  return out.sort((a,b)=>a.s-b.s)}
/* metnin başında ya da sonunda duran adı (ayraçlarıyla birlikte) çıkarır */
const YZ_AYR=/^[\s\-—–~:;,.·•|/()\[\]"“”«»'’]+|[\s\-—–~:;,·•|/()\[\]"“”«»'’]+$/g;
function yzKenarMi(t,os,oe){const once=t.slice(0,os).replace(YZ_AYR,'').trim(),sonra=t.slice(oe),sonraT=sonra.replace(YZ_AYR,'').trim();
  return {bas:once.length<=1&&/^\s*[:\-—–~"“«(\n]/.test(sonra),son:sonraT.length<=1||/^[’']?(?:nin|nın|nun|nün|in|ın|un|ün|dan|den)?\s*$/i.test(sonraT)}}
function yazarAyikla(metin,kaynak){
  let m=String(metin||'').replace(/([a-zçğıöşüâîû.!?…"”])([A-ZÇĞİÖŞÜÂÎÛ][a-zçğıöşüâîû])/g,'$1 $2');
  let yazar='',kitap='';const k=String(kaynak||'').trim();
  if(k){const yk=yzBul(k,'y'),kk=yzBul(k,'k');if(yk.length)yazar=yk[0].ad;if(kk.length){kitap=kk[0].ad;if(!yazar)yazar=kk[0].y}
    if(!yazar&&!kitap){const p=k.split(/\s*[,—–|/]\s*|\s+-\s+/).filter(Boolean);if(p.length>1){yazar=p[0];kitap=p.slice(1).join(', ')}else yazar=k}
    else if(!kitap){const p=k.split(/\s*[,—–|/(]\s*|\s+-\s+/).map(x=>x.replace(/[)]/g,'').trim()).filter(x=>x&&yzBul(x,'y').length===0);if(p.length)kitap=p.join(', ')}}
  /* metnin içinden: önce kenardaki kitap, sonra kenardaki yazar */
  for(const tip of ['k','y']){let bul=yzBul(m,tip);for(let i=bul.length-1;i>=0;i--){const b=bul[i],ke=yzKenarMi(m,b.os,b.oe);if(!(ke.bas||ke.son))continue;
      if(tip==='k'){if(!kitap)kitap=b.ad;if(!yazar)yazar=b.y}else if(!yazar)yazar=b.ad;else if(yazar!==b.ad)continue;
      let a=b.os,e=b.oe;const sonEk=m.slice(e).match(/^[’']?(?:nin|nın|nun|nün|in|ın|un|ün)\b/i);if(sonEk)e+=sonEk[0].length;
      m=(m.slice(0,a).replace(/[\s\-—–~:;,·•|/(\["“«']+$/,'')+' '+m.slice(e).replace(/^[\s\-—–~:;,·•|/)\]"”»']+/,'')).trim();bul=yzBul(m,tip);i=bul.length}}
  /* yazar ortada geçiyorsa adı metinde kalır, yalnız alana yazılır */
  if(!yazar){const ic=yzBul(m,'y');if(ic.length)yazar=ic[ic.length-1].ad}
  m=m.replace(/^["“”«„']+|["“”»']+$/g,'').replace(/\s+([,.;:!?])/g,'$1').trim();
  return {metin:m,yazar:yazar.trim(),kitap:kitap.trim()}}
const kaynakYap=q=>[q.yazar,q.kitap].filter(Boolean).join(' — ');
function alintiOnar(q){if(q.yazar==null&&q.kitap==null){
    if(q.okur){const p=String(q.kaynak||'').split(' — ');q.kitap=p[0]||'';q.yazar=p.slice(1).join(' — ')}
    else{const r=yazarAyikla('',q.kaynak);q.yazar=r.yazar;q.kitap=r.kitap}}
  q.yazar=q.yazar||'';q.kitap=q.kitap||'';q.kaynak=kaynakYap(q)||q.kaynak||'';return q}

/* ==================== Toplu yapıştırma çözümleyici ==================== */
function topluCoz(t){
  const m=($('#tpMetin')||{}).value||'',ayr0=($('#tpAyr')||{}).value||'oto',kat=($('#tpKat')||{}).value,bas=!!($('#tpBas')||{}).checked;
  let x=m.replace(/\r/g,'').replace(/ /g,' ').trim();if(!x)return [];
  const ayr=ayr0==='oto'?(/\n\s*(-{3,}|\*{3,}|_{3,})\s*\n/.test(x)?'cizgi':(/\n\s*\n/.test(x)?'bos':'satir')):ayr0;
  let p=ayr==='satir'?x.split('\n'):ayr==='cizgi'?x.split(/\n\s*(?:-{3,}|\*{3,}|_{3,})\s*(?:\n|$)/):x.split(/\n\s*\n+/);
  p=p.map(y=>y.trim().replace(/^(?:\d{1,3}[.)]|[•*])\s+/,'').trim()).filter(Boolean);
  const temiz=y=>y.replace(/^["“”«„']+|["“”»']+$/g,'').trim();
  const norm=y=>y.toLocaleLowerCase('tr').replace(/\s+/g,' ').trim();
  const var_=new Set((t==='z'?D.zikirler:D.alintilar).map(y=>norm(y.metin)));
  const out=[];let tekrar=0;
  p.forEach(y=>{
    let o;
    if(t==='a'){
      const L=y.split('\n');let metin=y,kaynak='';const son=L[L.length-1].trim();
      if(L.length>1&&/^[—–\-~]\s*\S/.test(son)){metin=L.slice(0,-1).join('\n');kaynak=son.replace(/^[—–\-~]\s*/,'')}
      else{const mm=y.match(/^([\s\S]+?)\s+[—–]\s+([^—–\n]{2,60})$/);if(mm){metin=mm[1];kaynak=mm[2]}}
      const r=yazarAyikla(temiz(metin),kaynak.trim());o={id:yid('Q'),kat,metin:temiz(r.metin),yazar:r.yazar,kitap:r.kitap,fav:false};o.kaynak=kaynakYap(o);
    }else{
      const L=y.split('\n');let ad,metin;
      if(bas&&L.length>1){ad=L[0].trim().replace(/[:：]$/,'');metin=L.slice(1).join('\n').trim()}
      else{metin=y;ad=y.split('\n')[0];if(ad.length>48)ad=ad.slice(0,48).replace(/\s+\S*$/,'')+'…'}
      const sy=(y.match(/(\d{1,4})\s*(?:defa|kere|kez)\b/i)||[])[1]||'';
      o={id:yid('Z'),kat,ad:temiz(ad),metin:metin.trim(),sayi:sy,fav:false,sayac:0,tarih:''};
    }
    if(!o.metin)return;const n=norm(o.metin);if(var_.has(n)){tekrar++;return}var_.add(n);out.push(o);
  });
  out.tekrar=tekrar;return out;
}

    '<div class="not">Bütçe &amp; Hedef · sürüm '+SURUM+' · çevrimdışı çalışır</div>')},

/* Tam ekran: tarayıcı ilk dokunuştan önce izin vermez; her dokunuşta gerekiyorsa açılır */
function tamEkran(){
  if(U.tamEkran===false||document.fullscreenElement)return;
  try{if(matchMedia('(display-mode: fullscreen)').matches)return}catch(e){}
  const de=document.documentElement;if(!de.requestFullscreen)return;
  de.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
}
function temaUygula(){const t=U.tema||'auto';if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=(t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'#141816':'#f3f0e8'}

/* ---------- 1.6: Milli Emlak köprüsü ----------
   Uygulama Milli Emlak (Apps Script) içinden açıldığında kayıtlar Milli Emlak sunucusunda da tutulur;
   böylece bilgisayar ve telefon arasında eşleşir. Tek başına açıldığında (GitHub/Claude) hiçbir etkisi yoktur. */
function icImza(){try{return JSON.stringify(Object.assign({},D,{meta:null}))}catch(e){return ''}}
const Kopru={hedef:null,koken:'*',bagli:false,_t:0,
  bul(){try{if(window.opener&&window.opener!==window)return window.opener}catch(e){}try{if(window.parent&&window.parent!==window&&window.parent.location.origin===location.origin)return window.parent}catch(e){}return null},
  basla(){this.hedef=this.bul();if(!this.hedef)return;addEventListener('message',e=>this.al(e));
    this.yolla({tip:'mebut-hazir',son:(D.meta&&D.meta.son)||0,tohum:!!(D.meta&&D.meta.tohum),surum:SURUM})},
  yolla(m){try{this.hedef&&this.hedef.postMessage(m,this.koken)}catch(e){}},
  al(e){const m=e.data;if(!m||typeof m!=='object'||e.source!==this.hedef||String(m.tip||'').indexOf('mebut-')!==0)return;
    if(m.tip==='mebut-veri'){this.koken=e.origin&&e.origin!=='null'?e.origin:'*';this.bagli=true;
      const g=m.D&&typeof m.D==='object'?m.D:null,ys=(D.meta&&D.meta.son)||0,gs=(g&&g.meta&&g.meta.son)||0,tohum=!!(D.meta&&D.meta.tohum);
      if(g&&(tohum||gs>ys)){D=onar(g);kaydet._son=icImza();try{localStorage.setItem(KEY,JSON.stringify(D))}catch(x){}
        try{zSec();aSec()}catch(x){}ciz();toast(m.eski?'Milli Emlak’taki eski Bütçe kayıtları aktarıldı':'Milli Emlak’taki kayıtlar yüklendi')
        if(m.eski)this.gonder(true)}
      else if(!tohum&&(!g||ys>gs))this.gonder(true)}
    else if(m.tip==='mebut-kaydedildi'){this.sonKayit=Date.now()}
    else if(m.tip==='mebut-okur'){okurSenk(m.liste)}
    if(m.ana&&typeof m.ana==='string'&&/^(https:|file:)/.test(m.ana)){U.anaAdres=m.ana;try{uiKaydet()}catch(x){}}
    if(m.tip==='mebut-veri')setTimeout(()=>okurAl(),300)},
  gonder(hemen){if(!this.bagli)return;clearTimeout(this._t);const f=()=>this.yolla({tip:'mebut-kaydet',D:JSON.parse(JSON.stringify(D))});if(hemen)f();else this._t=setTimeout(f,600)}
};

/* ---------- 1.7: Okur alıntıları ----------
   Okur'da vurgulanan (alıntılanan) metinler "Okur" kategorisiyle buraya eklenir; aynı alıntı iki kez eklenmez,
   burada silinen Okur alıntısı bir daha gelmez. Okur aynı adreste açılıyorsa (GitHub, yerel dosya) doğrudan okunur;
   Milli Emlak içinden açılınca Milli Emlak aracılığıyla alınır. Okur'un verisine YAZILMAZ. */
async function okurAlintiOku(){try{if(!window.indexedDB)return null;
    if(indexedDB.databases){const l=await indexedDB.databases();if(!l.some(d=>d&&d.name==='okur-db'))return null}
    const db=await new Promise((ok,red)=>{const r=indexedDB.open('okur-db');r.onupgradeneeded=()=>{try{r.transaction.abort()}catch(e){}};r.onsuccess=()=>ok(r.result);r.onerror=()=>red(r.error);r.onblocked=()=>red(new Error('blocked'))});
    if(!db.objectStoreNames.contains('books')){db.close();return null}
    const books=await new Promise((ok,red)=>{const q=db.transaction('books','readonly').objectStore('books').getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>red(q.error)});db.close();
    const out=[];books.forEach(b=>(b.annots||[]).forEach(a=>{if(a&&a.kind==='highlight'&&a.text&&String(a.text).trim())out.push({id:String(a.id),metin:String(a.text).replace(/\s+/g,' ').trim(),not:a.note||'',kitap:b.title||'',yazar:b.author||'',ts:a.ts||0})}));
    return out}catch(e){return null}}
function okurSenk(liste){if(!Array.isArray(liste)||!liste.length)return 0;let yeni=0,deg=0;
  liste.slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(o=>{if(!o||!o.id||!o.metin||D.okurAtla.indexOf(o.id)>-1)return;
    const yz=o.yazar||'',kt=o.kitap||'',kaynak=kaynakYap({yazar:yz,kitap:kt});const x=D.alintilar.find(q=>q.okur===o.id);
    if(x){if(x.metin!==o.metin||x.yazar!==yz||x.kitap!==kt){x.metin=o.metin;x.yazar=yz;x.kitap=kt;x.kaynak=kaynak;deg++}return}
    D.alintilar.unshift({id:yid('Q'),kat:'Okur',metin:o.metin,yazar:yz,kitap:kt,kaynak,fav:false,okur:o.id});yeni++});
  if(yeni||deg){kaydet();if(U.tab==='alinti'||U.tab==='butce')ciz();if(yeni)toast('Okur’dan '+yeni+' yeni alıntı eklendi')}
  return yeni}
let _okurT=0;
async function okurAl(){if(Date.now()-_okurT<4000)return;_okurT=Date.now();const l=await okurAlintiOku();if(l&&l.length){okurSenk(l);return}
  if(Kopru.hedef)Kopru.yolla({tip:'mebut-okur-iste'})}
/* ---------- 1.7: Ana sayfa (Milli Emlak) ---------- */
function anaSayfa(){try{kaydet(true);Kopru.gonder(true)}catch(e){}
  const ana=(U&&U.anaAdres)||'';
  /* 1) Milli Emlak içinde (aynı sayfada çerçeve olarak) açıldıysa: modülü kapat, ana ekrana dön */
  try{if(window.parent&&window.parent!==window&&window.parent.location.origin===location.origin&&typeof window.parent.modulKapat==='function'){window.parent.modulKapat();return}}catch(e){}
  /* 2) Milli Emlak'ın açtığı sekmedeyse: o sekmeye dön, bu sekmeyi kapat */
  let w=null;try{w=window.opener}catch(e){}
  try{if(w&&!w.closed){w.focus();Kopru.yolla({tip:'mebut-ana'})}}catch(e){}
  setTimeout(()=>{try{if(w&&!w.closed)window.close()}catch(e){}
    /* 3) kapanmadıysa (telefon tarayıcısı izin vermez) ana sayfa adresine git */
    setTimeout(()=>{if(window.closed)return;if(ana){try{window.top.location.href=ana}catch(e){location.href=ana}}
      else{toast('Ana sayfa adresi kayıtlı değil — bir kez kaydet, düğme hep oraya gitsin',3500);A.anaAyar()}},300)},120)}
function anaDugme(){const b=$('#anaBtn');if(b)b.hidden=false}

/* ---------- Başlat ---------- */
(function(){
  let u={};try{u=JSON.parse(localStorage.getItem(UKEY)||'{}')}catch(e){}
  U={tab:SEKMELER.some(s=>s[0]===u.tab)?u.tab:'butce',tema:u.tema||'auto',suz:{},zKat:'hepsi',zAra:'',aKat:'hepsi',aAra:'',hf:'hepsi',zAcik:false,aAcik:false,duzen:null,anaAdres:typeof u.anaAdres==='string'?u.anaAdres:'',bRenk:u.bRenk==='pastel'?'pastel':'klasik',aGrup:/^(kat|yazar|kitap)$/.test(u.aGrup)?u.aGrup:'kat',aSec:'hepsi',dGor:u.dGor==='tablo'?'tablo':'bolum',dGrup:/^(yil|kisi|yon|tur)$/.test(u.dGrup)?u.dGrup:'yil',dKapali:{}};
  temaUygula();U.tamEkran=u.tamEkran!==false;
  document.addEventListener('pointerup',e=>{if(e.target&&e.target.closest&&e.target.closest('input[type=file],#yedekIn'))return;tamEkran()},{passive:true});
  tamEkran();
  D=yukle();kaydet._son=icImza();zSec();aSec();ciz();Kopru.basla();anaDugme();setTimeout(()=>okurAl(),1200);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')okurAl()});
  /* test/destek erişimi (salt okunur + kaydet) */
  window.__bh={SURUM,U:()=>U,anaSayfa:()=>anaSayfa(),D:()=>D,degistir:f=>{f(D);kaydet();ciz()},kopru:()=>({bagli:Kopru.bagli,sonKayit:Kopru.sonKayit||0})};
  $('#yedekIn').addEventListener('change',e=>{yedekYukle(e.target.files[0]);e.target.value=''});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){kapat();$('#hm').hidden=true}});
  window.addEventListener('pagehide',()=>kaydet(true));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')kaydet(true)});
  /* Başka sekmede değişirse */
  window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{D=onar(JSON.parse(e.newValue));ciz()}catch(x){}}});
})();

})();
</script>

/* Kurulu uygulama (PWA): çevrimdışı önbellek, uygulama bildirimi, yeni sürüm uyarısı */
(function(){
  var ok=(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))&&('serviceWorker' in navigator)&&!/claude|googleusercontent|script\.google/.test(location.hostname);
  if(!ok)return;
  var had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(function(reg){
    window.__swReg=reg;
    if(!document.querySelector('link[rel=manifest]')){var l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l)}
    setInterval(function(){reg.update().catch(function(){})},30*60*1000);
  }).catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(!had){had=true;return}banner()});

  }
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
